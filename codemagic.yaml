workflows:
  ios-simulator:
    name: Expo iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build iOS Simulator app
        script: |
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "$(basename -s .xcodeproj ios/*.xcodeproj)" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
