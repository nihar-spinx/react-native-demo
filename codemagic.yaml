workflows:
  ios-simulator:
    name: Expo iOS Simulator + Screenshots
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default

    scripts:
      # --------------------------------------------------
      # 1. Install Expo / React Native dependencies
      # --------------------------------------------------
      - name: Install dependencies
        script: |
          npm install

      # --------------------------------------------------
      # 2. Generate native iOS project
      # --------------------------------------------------
      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios

      # --------------------------------------------------
      # 3. Install CocoaPods
      # --------------------------------------------------
      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      # --------------------------------------------------
      # 4. Build iOS Simulator app
      # --------------------------------------------------
      - name: Build iOS Simulator app
        script: |
          xcodebuild \
            -workspace ios/*.xcworkspace \
            -scheme "$(basename -s .xcodeproj ios/*.xcodeproj)" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # --------------------------------------------------
      # 5. Find generated .app
      # --------------------------------------------------
      - name: Find iOS app
        script: |
          echo "Searching for generated .app files..."

          find "$CM_BUILD_DIR/build" \
            -type d \
            -name "*.app" \
            -print

          APP_PATH=$(find "$CM_BUILD_DIR/build" \
            -type d \
            -path "*Debug-iphonesimulator/*.app" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iOS Simulator .app not found"
            exit 1
          fi

          echo "================================="
          echo "FOUND APP:"
          echo "$APP_PATH"
          echo "================================="

          echo "$APP_PATH" > "$CM_BUILD_DIR/app_path.txt"

      # --------------------------------------------------
      # 6. Install Maestro
      # --------------------------------------------------
      - name: Install Maestro
        script: |
          curl -Ls "https://get.maestro.mobile.dev" | bash

          export PATH="$PATH:$HOME/.maestro/bin"

          maestro --version

      # --------------------------------------------------
      # 7. Start iOS Simulator
      # --------------------------------------------------
      - name: Start iOS Simulator
        script: |
          export PATH="$PATH:$HOME/.maestro/bin"

          echo "Starting iOS Simulator..."

          maestro start-device --platform ios

          echo "Waiting for simulator..."

          sleep 30

          echo "Available simulators:"
          xcrun simctl list devices

          echo "Booted simulators:"
          xcrun simctl list devices booted

          # Find the currently booted simulator
          BOOTED_UDID=$(xcrun simctl list devices booted | \
            grep -oE '[0-9A-Fa-f-]{36}' | head -1)

          if [ -z "$BOOTED_UDID" ]; then
            echo "ERROR: No booted iOS Simulator found"
            exit 1
          fi

          echo "================================="
          echo "BOOTED SIMULATOR:"
          echo "$BOOTED_UDID"
          echo "================================="

          echo "$BOOTED_UDID" > "$CM_BUILD_DIR/simulator_udid.txt"

          echo "Waiting for Simulator to fully boot..."

          xcrun simctl bootstatus "$BOOTED_UDID" -b

          echo "Simulator is ready."

      # --------------------------------------------------
      # 8. Install app on iOS Simulator
      # --------------------------------------------------
      - name: Install app on Simulator
        script: |
          APP_PATH=$(cat "$CM_BUILD_DIR/app_path.txt")
          SIMULATOR_UDID=$(cat "$CM_BUILD_DIR/simulator_udid.txt")

          echo "================================="
          echo "APP PATH:"
          echo "$APP_PATH"
          echo "================================="

          echo "================================="
          echo "SIMULATOR UDID:"
          echo "$SIMULATOR_UDID"
          echo "================================="

          # Verify app exists
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app does not exist:"
            echo "$APP_PATH"
            exit 1
          fi

          echo "Installing app..."

          xcrun simctl install \
            "$SIMULATOR_UDID" \
            "$APP_PATH"

          echo "================================="
          echo "APP INSTALLED SUCCESSFULLY"
          echo "================================="

      # --------------------------------------------------
      # 9. Run Maestro screenshots
      # --------------------------------------------------
      - name: Run Maestro screenshots
        script: |
          export PATH="$PATH:$HOME/.maestro/bin"

          SIMULATOR_UDID=$(cat "$CM_BUILD_DIR/simulator_udid.txt")

          echo "Running Maestro on:"
          echo "$SIMULATOR_UDID"

          mkdir -p "$CM_BUILD_DIR/screenshots"

          maestro \
            --device "$SIMULATOR_UDID" \
            test \
            --test-output-dir "$CM_BUILD_DIR/screenshots" \
            .maestro/

      # --------------------------------------------------
      # 10. List generated screenshots
      # --------------------------------------------------
      - name: List screenshots
        script: |
          echo "================================="
          echo "GENERATED SCREENSHOTS"
          echo "================================="

          if [ -d "$CM_BUILD_DIR/screenshots" ]; then
            find "$CM_BUILD_DIR/screenshots" \
              -type f \
              -print
          else
            echo "No screenshots directory found."
          fi

    # --------------------------------------------------
    # Codemagic artifacts
    # --------------------------------------------------
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - screenshots/**/*.png
      - screenshots/**/*
